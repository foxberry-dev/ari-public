[package]
name = "ari"
version = "0.1.0"
edition = "2024"
description = "A local, agent-connected decision workspace"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = "0.3"
mime_guess = "2"
rmcp = { version = "0.12", features = ["server", "macros", "transport-streamable-http-server"] }
rust-embed = "8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = 1

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", features = ["signal", "process"] }
